<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mictap</title>
<style>
  @font-face { font-family: "IBM Plex Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-serif-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Serif"; font-style: italic; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-serif-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Serif"; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/ibm-plex-serif-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  :root { --font: "IBM Plex Serif", Georgia, serif; --mono: "IBM Plex Mono", monospace; color-scheme: light;
    --bg: #fbfaf7; --fg: #1f2328; --muted: #6b6f76; --line: #d8d6d0; --surface: #fffefb; --bar: #f6f4ef;
    --accent: #2f4f8f; --hl: #e6ecf7; --grid: rgba(47, 79, 143, .07); --err: #a33; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark;
    --bg: #15181d; --fg: #e3e5e8; --muted: #9aa1ab; --line: #333a44; --surface: #1b1f25; --bar: #191d23;
    --accent: #8fb0ea; --hl: #22324d; --grid: rgba(143, 176, 234, .06); --err: #e88; } }
  [hidden] { display: none !important; }
  body { margin: 0; background-color: var(--bg); color: var(--fg); font: 17px/1.5 var(--font);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; background-attachment: fixed; }
  main { max-width: 76rem; margin: 0 auto; padding: 1.5rem 16px 5rem; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-weight: 600; font-size: 1.35rem; margin: 0 0 1.5rem; }
  h1 .sep { color: var(--muted); font-weight: 400; margin: 0 .3em; }
  h1:has(+ .meta) { margin-bottom: .3rem; }
  h2 { font-weight: 400; font-style: italic; font-size: 1rem; color: var(--muted); margin: 1.6rem 0 .2rem; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  time { font-variant-numeric: tabular-nums lining-nums; }
  .line time, .player time { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .err { color: var(--err); margin-left: .6em; }

  /* list */
  .list { max-width: 40rem; }
  .rec { display: grid; grid-template-columns: 3.5rem 1fr auto; gap: 1rem; align-items: baseline; padding: .45rem 0;
    border-bottom: 1px solid var(--line); color: inherit; }
  .rec:hover time { color: var(--accent); }
  .rec .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .state { font-size: .8em; color: var(--muted); display: flex; gap: .5rem; align-items: center; }
  .bar { width: 5rem; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .upload { display: inline-block; margin-top: 1.6rem; font-size: .9em; }

  /* recording */
  .meta { color: var(--muted); font-size: .9em; margin: 0 0 1.8rem; }
  .cols { display: grid; grid-template-columns: minmax(0, 44rem) 19rem; justify-content: space-between; gap: 4rem; align-items: start; }
  aside { position: sticky; top: 1rem; }
  .ask { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .7rem .9rem .8rem; }
  .ask h3 { margin: 0; font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .ask h3 span { font-size: .72em; font-weight: 400; color: var(--muted); }
  .ask ul { list-style: none; margin: .4rem 0 .7rem; padding: 0; }
  .ask li { position: relative; display: grid; grid-template-columns: 1.1rem 1fr auto; gap: .5rem; padding: .25rem 0;
    font-size: .86em; line-height: 1.4; cursor: pointer; }
  .ask li:hover, .ask li.playing { background: var(--hl); margin: 0 -.9rem; padding: .25rem .9rem; }
  .play { color: var(--muted); font-size: .7em; line-height: 2; }
  .play:hover { color: var(--accent); }
  .slot { font-size: .85em; color: var(--muted); text-align: right; }
  .slot.sugg { font-style: italic; }
  .slot.set { color: var(--fg); font-weight: 600; }
  .answers { display: flex; flex-wrap: wrap; gap: .35rem; }
  .ok { margin-left: auto; width: 2rem; height: 1.7rem; border-radius: 999px; background: var(--accent); color: var(--surface); font-size: .9em; }
  .ok:disabled { background: var(--line); cursor: default; }
  .chip { font-size: .85em; border: 1px solid var(--line); border-radius: 999px; padding: 0 .65rem; line-height: 1.7; background: var(--surface); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.guess { border-color: var(--accent); color: var(--accent); font-style: italic; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-style: normal; }
  .chip.new { width: 5.5rem; outline: none; }
  .chip.new:focus { border-color: var(--accent); }
  .chip.new::placeholder { color: var(--muted); }
  .chip kbd { font: .75em var(--font); color: var(--muted); margin-left: .35rem; }
  .chip[aria-pressed="true"] kbd { color: inherit; opacity: .7; }
  .menu { position: absolute; z-index: 3; left: 5.3rem; top: calc(100% - .2rem); display: flex; gap: .3rem; padding: .4rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); cursor: default; }
  .line, .ask li { scroll-margin: 4rem 0 8rem; }
  .answers { transition: opacity .15s; }
  .ask:has(.menu) .answers { opacity: .2; pointer-events: none; }
  .ask .menu { left: auto; right: 0; top: calc(100% - .1rem); flex-wrap: wrap; width: max-content; max-width: 17rem; }

  .line { position: relative; display: grid; grid-template-columns: 4.2rem 6.5rem 1fr; gap: .7rem; padding: .2rem .4rem; border-radius: 4px; }
  .line.named { cursor: pointer; }
  .line time { color: var(--muted); font-size: .85em; padding-top: .15em; }
  .line.audio time { cursor: pointer; }
  .line.audio time:hover { color: var(--accent); }
  .line b { font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line b.set { font-weight: 600; color: var(--fg); }
  .line b.sugg { font-style: italic; }
  .line.same b { visibility: hidden; }
  .line.same:hover b, .line.playing b { visibility: visible; }
  .line.playing, .line.named:hover { background: var(--hl); }

  .player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: .85em; }
  .player .pp { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; flex: none; }
  .player input { flex: 1; min-width: 0; accent-color: var(--accent); }

  @media (max-width: 1000px) {
    .cols { grid-template-columns: 1fr; gap: 1.5rem; }
    aside { order: -1; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: .5rem 0; }
    .line { grid-template-columns: 3.6rem 1fr; row-gap: 0; }
    .line b, .line span { grid-column: 2; }
    .line time { grid-row: span 2; }
    .line.same b { display: none; }
    .menu { left: 4rem; flex-wrap: wrap; }
  }
</style>
<body>
<main id="app"></main>
<datalist id="names"></datalist>
<div class="player" id="bar" hidden>
  <button class="pp" id="pp" title="Play (space)">▶</button><time id="cur">00:00</time>
  <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Seek"><time id="dur">00:00</time>
</div>
<audio id="player" preload="metadata"></audio>
<script>
const app = document.getElementById("app");
const player = document.getElementById("player");
const bar = document.getElementById("bar"), pp = document.getElementById("pp"), seek = document.getElementById("seek");
let lines = [];     // transcript and card samples as { seg, el }, highlighted while playing
let stopAt = null;
let playingEl = null;
let playingSeg = null;
// Set by a click that starts a line, so the transcript scrolls to it even if the user had
// scrolled away; continuous playback only follows while the playing line is in view.
let follow = false;
let cur = null;     // what the recording page draws from, see show()
let pick = {};      // label -> the name chosen on its card, not saved yet
let menu = null;
let focus = null;   // the line whose menu is open: {seg, card}
let known = null;

function h(tag, props = {}, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...nodes(kids));
  return el;
}
const nodes = kids => kids.flat(Infinity).filter(k => k != null && k !== false);
const pad = n => String(n).padStart(2, "0");
const clock = ms => {
  const s = Math.floor(ms / 1000);
  return (s >= 3600 ? `${Math.floor(s / 3600)}:` : "") + `${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
};
const short = label => label.split("/")[1];

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.status === 204 ? null : res.json();
}
const put = (path, body) => api(path, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

function start(seg, only) {
  player.currentTime = seg.start_ms / 1000;
  stopAt = only ? seg.end_ms / 1000 : null;
  follow = !only;
  player.play();
}

const inView = el => {
  const r = el.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight - (bar.hidden ? 0 : bar.offsetHeight);
};

player.addEventListener("timeupdate", () => {
  const t = player.currentTime;
  if (stopAt != null && t >= stopAt) player.pause();
  seek.value = t;
  document.getElementById("cur").textContent = clock(t * 1000);
  let now = null;
  for (const { seg, el, transcript } of lines) {
    const on = !player.paused && seg.start_ms / 1000 <= t && t < seg.end_ms / 1000;
    el.classList.toggle("playing", on);
    if (on && transcript && !now) now = el;
  }
  if (now && now !== playingEl && (follow || (playingEl && inView(playingEl)))) {
    now.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  if (now) { follow = false; playingEl = now; playingSeg = now.seg; }
});
player.addEventListener("pause", () => { stopAt = null; pp.textContent = "▶"; player.dispatchEvent(new Event("timeupdate")); });
player.addEventListener("play", () => { pp.textContent = "❚❚"; });
player.addEventListener("durationchange", () => {
  if (!isFinite(player.duration)) return;
  seek.max = player.duration;
  document.getElementById("dur").textContent = clock(player.duration * 1000);
});
pp.onclick = () => player.paused ? player.play() : player.pause();
seek.oninput = () => { stopAt = null; player.currentTime = +seek.value; };

function closeMenu() { menu?.remove(); menu = null; focus = null; }
addEventListener("click", closeMenu);
addEventListener("keydown", e => {
  if (!cur || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") closeMenu();
  else if (e.key === " " && !bar.hidden) { e.preventDefault(); pp.onclick(); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && focus) { e.preventDefault(); step(e.key === "ArrowDown" ? 1 : -1); }
  else if (/^[1-9]$/.test(e.key) && cur.r.editable && (focus || playingSeg)) {
    const c = choices()[e.key - 1];
    if (c) { e.preventDefault(); nameLine(focus?.seg ?? playingSeg, c); }
  }
});

function progress(r) {
  const p = r.progress;
  if (!p) return r.status === "failed" ? "failed" : null;
  if (p.step === "unstarted") return "not started";
  if (p.step === "transcribing") return [h("span", { className: "bar" }, h("i", { style: `width: ${p.percent}%` })), `transcribing ${p.percent}%`];
  if (p.since_ms == null) return "waiting to diarize";
  const s = Math.round((Date.now() - p.since_ms) / 1000);
  return `diarizing ${s >= 60 ? `${Math.floor(s / 60)}m ` : ""}${s % 60}s`;
}

const day = date => {
  if (!date) return "Unknown date";
  const d = new Date(date.slice(0, 10));
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long",
    year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
};

async function list() {
  cur = null;
  bar.hidden = true;
  const recs = await api("/recordings");
  const days = Map.groupBy(recs, r => day(r.date));
  const who = r => {
    if (r.progress) return h("span", { className: "who muted" }, "…");
    if (r.status === "done" && !r.attendees.length && !r.unnamed) return h("span", { className: "who muted" }, "no speech");
    return h("span", { className: "who" }, r.attendees.join(", "),
      r.unnamed ? h("span", { className: "muted" }, ` +${r.unnamed}`) : null);
  };
  app.replaceChildren(...nodes([
    h("h1", {}, "mictap"),
    h("div", { className: "list" },
      [...days].map(([d, rs]) => [
        h("h2", {}, d),
        rs.map(r => h("a", { className: "rec", href: "#" + r.id },
          h("time", {}, r.date?.slice(11) ?? r.id), who(r),
          h("span", { className: "state" }, progress(r) ?? (r.audio === "expired" ? "audio expired" : null)))),
      ]),
      h("a", { className: "upload", href: "/upload" }, "Upload a recording")),
  ]));
  return recs.some(r => r.progress);
}

// Names in this meeting: confirmed ones in label order, then the lines' own.
function people() {
  const out = [];
  for (const n of [...cur.labels.map(l => cur.sp(l).name), ...cur.r.lines.map(s => s.line_name)])
    if (n && n !== "?" && !out.includes(n)) out.push(n);
  return out;
}
const choices = () => [...people(), "?"];
const asked = () => cur.labels.filter(l => !cur.sp(l).name);

// The name a line shows and its shade: set when it teaches a voice, sugg for a suggestion.
function shown(seg) {
  if (seg.line_name) return { n: seg.line_name, cls: seg.taught ? "set" : "" };
  const s = cur.sp(seg.speaker);
  if (s.name) return { n: s.name, cls: seg.taught && s.name !== "?" ? "set" : "" };
  if (seg.speaker && seg.speaker === asked()[0] && pick[seg.speaker]) return { n: pick[seg.speaker], cls: "" };
  if (s.suggested) return { n: s.suggested, cls: "sugg" };
  return { n: "?", cls: "" };
}

function fail(err) { cur.err.textContent = err.message; }

// Naming a line from its menu moves the menu on to the next one (click it to hear it), so a
// run of lines is named without reaching for each; a number key while just listening names the playing line and stays put.
async function nameLine(seg, name) {
  const card = focus && same(focus.seg, seg) ? focus.card : null;
  closeMenu();
  const clear = seg.line_name === name;
  try {
    await put(`/recordings/${encodeURIComponent(cur.id)}/lines`,
      { track: seg.track, start_ms: seg.start_ms, end_ms: seg.end_ms, name: clear ? null : name });
    await show(cur.id);
    if (card != null && !clear) { focus = { seg, card }; step(1); }
  } catch (err) { fail(err); }
}

const same = (a, b) => a.track === b.track && a.start_ms === b.start_ms;
const pool = card => card ? lines.filter(x => !x.transcript) : cur.transcript;

// Opens this line's menu in place (playing only that line when clicked), so nothing moves
// while choosing; clicking it again replays it.
function focusLine(seg, card, play = true) {
  const x = pool(card).find(x => same(x.seg, seg));
  if (!x) return;
  if (!focus || !same(focus.seg, seg)) {
    openMenu(x.el, x.seg, card);
    x.el.scrollIntoView({ block: "nearest" });
  }
  if (play && cur.audio) start(x.seg, true);
}

function step(by) {
  const p = pool(focus.card);
  const x = p[p.findIndex(x => same(x.seg, focus.seg)) + by];
  if (x) focusLine(x.seg, focus.card, false);
}

function newName(done) {
  const input = h("input", { className: "chip new", placeholder: "Name…", ariaLabel: "New name" });
  input.setAttribute("list", "names");
  input.onkeydown = e => {
    if (e.key === "Enter" && input.value.trim()) done(input.value.trim());
    if (e.key === "Escape") closeMenu();
  };
  return input;
}

function openMenu(host, seg, card) {
  closeMenu();
  if (!cur.r.editable) return;
  focus = { seg, card };
  const input = newName(n => nameLine(seg, n));
  input.onchange = () => input.value.trim() && nameLine(seg, input.value.trim());
  menu = h("div", { className: "menu", onclick: e => e.stopPropagation() },
    choices().map((c, k) => h("button", { className: "chip", ariaPressed: String(seg.line_name === c),
      title: c === "?" ? "Mixed or unsure" : c, onclick: () => nameLine(seg, c) }, c, k < 9 ? h("kbd", {}, String(k + 1)) : null)),
    input);
  host.append(menu);
}

// Three of a label's lines from across the meeting (preferring ones of 2 s or more), so a
// cluster of two people or a room is audible.
function samples(label) {
  const own = cur.r.lines.filter(s => s.speaker === label);
  const long = own.filter(s => s.end_ms - s.start_ms >= 2000);
  const pool = long.length >= 3 ? long : own;
  return [...new Set([0, 0.5, 1].map(f => pool[Math.round(f * (pool.length - 1))]))];
}

function drawAsk() {
  const queue = asked();
  cur.ask.hidden = !cur.r.editable || !queue.length;
  if (cur.ask.hidden) return [];
  const l = queue[0], s = cur.sp(l);
  const segs = samples(l);
  // Every sample named on its own: their name if they agree, else several people.
  const own = segs.every(x => x.line_name) && new Set(segs.map(x => x.line_name));
  const group = pick[l] ?? s.suggested ?? (own && (own.size === 1 ? [...own][0] : "?"));
  const choose = n => { pick[l] = n; paint(); };
  const input = newName(choose);
  input.onchange = () => input.value.trim() && choose(input.value.trim());
  if (pick[l] && pick[l] !== "?" && !people().includes(pick[l])) input.value = pick[l];
  const chips = [...new Set([s.suggested, ...people()].filter(Boolean)), "?"].map(n =>
    h("button", { className: "chip" + (n === s.suggested && pick[l] == null ? " guess" : ""), ariaPressed: String(n === group),
      title: n === "?" ? "Several people, or not sure" : n, onclick: () => choose(n) }, n));
  const rows = segs.map(seg => {
    const slot = h("span", { className: "slot" + (seg.line_name ? (seg.taught ? " set" : "") : pick[l] == null && s.suggested ? " sugg" : "") },
      seg.line_name ?? group ?? "?");
    const li = h("li", { onclick: e => { e.stopPropagation(); focusLine(seg, true); } },
      h("button", { className: "play", title: "Play", disabled: !cur.audio,
        onclick: e => { e.stopPropagation(); closeMenu(); start(seg, true); } }, "▶"),
      h("span", {}, seg.text), slot);
    return { seg, el: li };
  });
  const ok = async () => {
    const heard = segs.filter(x => !x.line_name).map(x => ({ start_ms: x.start_ms, end_ms: x.end_ms, correct: true }));
    try {
      await put(`/recordings/${encodeURIComponent(cur.id)}/speakers`,
        { [l]: group === "?" ? { name: "?" } : { name: group, heard } });
      delete pick[l];
      known = null;
      await show(cur.id);
    } catch (err) { fail(err); }
  };
  cur.ask.replaceChildren(
    h("h3", {}, "Who is this?", h("span", {}, queue.length > 1 ? `1 of ${queue.length}` : "")),
    h("ul", {}, rows.map(x => x.el)),
    h("div", { className: "answers" }, chips, input,
      h("button", { className: "ok", title: "Save", disabled: !group, onclick: ok }, "✓")));
  return rows;
}

// Draws the names and the card from `cur` and `pick`, without fetching.
function paint() {
  closeMenu();
  let prev = null;
  for (const { seg, el, who } of cur.transcript) {
    const { n, cls } = shown(seg);
    who.textContent = n;
    who.className = cls;
    const key = n + "/" + cls;
    el.classList.toggle("same", n !== "?" && key === prev);
    prev = key;
  }
  lines = [...cur.transcript, ...drawAsk()];
  const unknown = asked().length;
  const names = people();
  cur.meta.replaceChildren(...nodes([
    names.join(", ") + (unknown ? `${names.length ? " and " : ""}${unknown} unknown` : ""),
    names.length || unknown ? " · " : null,
    `${Math.round(cur.r.total_ms / 60000)} minutes`,
    progress(cur.r) ? [" · ", progress(cur.r)] : null,
    !cur.audio ? (cur.r.audio === "expired" ? " · audio deleted after 30 days" : " · no audio yet") : null,
    cur.err,
  ]));
  player.dispatchEvent(new Event("timeupdate"));
}

async function show(id) {
  const r = await api("/recordings/" + encodeURIComponent(id));
  const audio = r.audio === "ready";
  if (player.dataset.id !== id) {
    player.pause();
    player.src = audio ? `/r/${encodeURIComponent(id)}/audio.ogg` : "";
    player.dataset.id = id;
    pick = {};
  }
  bar.hidden = !audio;
  if (r.editable && !known) {
    known = api("/recordings").then(rs => [...new Set(rs.flatMap(x => x.attendees))].sort());
    known.then(ns => document.getElementById("names").replaceChildren(...ns.map(n => h("option", { value: n }))), () => { known = null; });
  }

  const labels = [...new Set(r.lines.map(s => s.speaker).filter(Boolean))]
    .sort((a, b) => (a.startsWith("remote") - b.startsWith("remote")) || short(a).slice(1) - short(b).slice(1));
  const transcript = r.lines.map(seg => {
    const who = h("b");
    const el = h("div", { className: "line" + (audio ? " audio" : "") + (r.editable ? " named" : ""),
      onclick: e => { e.stopPropagation(); focusLine(seg, false); } },
      h("time", { title: audio ? "Play from here" : "", onclick: e => { e.stopPropagation(); closeMenu(); if (audio) start(seg); } },
        clock(seg.start_ms)),
      who, h("span", {}, seg.text));
    el.seg = seg;
    return { seg, el, who, transcript: true };
  });
  cur = { id, r, audio, labels, transcript, sp: l => r.speakers[l] ?? {},
    ask: h("div", { className: "ask" }), meta: h("p", { className: "meta" }), err: h("span", { className: "err" }) };
  playingEl = null;
  playingSeg = playingSeg && transcript.find(x => x.seg.start_ms === playingSeg.start_ms && x.seg.track === playingSeg.track)?.seg;
  const date = r.date ? `${day(r.date)}, ${r.date.slice(11)}` : id;
  app.replaceChildren(
    h("h1", {}, h("a", { href: "#" }, "mictap"), h("span", { className: "sep" }, "/"), date),
    cur.meta,
    h("div", { className: "cols" }, h("section", {}, transcript.map(x => x.el)), h("aside", {}, cur.ask)));
  paint();
  return r.progress != null;
}

let refresh;
async function route() {
  clearTimeout(refresh);
  const id = decodeURIComponent(location.hash.slice(1));
  try {
    if (await (id ? show(id) : list())) refresh = setTimeout(route, 5000);
  } catch (err) { app.replaceChildren(h("p", {}, err.message)); }
}
addEventListener("hashchange", route);
route();
</script>
