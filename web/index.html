<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mictap</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --hl: #fef3c7; --accent: #2563eb;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #e7e5e4; --muted: #a8a29e; --line: #44403c; --hl: #422006; --accent: #60a5fa;
            --ok: #4ade80; }
  }
  body { margin: 0 auto; max-width: 52rem; padding: 1rem 1rem 6rem; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 .3rem; }
  table { table-layout: fixed; }
  td:nth-child(1) { width: 4rem; }
  td:nth-child(2) { width: 5rem; }
  td:nth-child(4) { width: 7rem; text-align: right; }
  progress { width: 6rem; vertical-align: middle; }
  .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .4rem .5rem .4rem 0; border-bottom: 1px solid var(--line); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: none; color: inherit;
           border-radius: 4px; padding: .1rem .5rem; }
  button:disabled { cursor: default; opacity: .4; }
  input { font: inherit; padding: .2rem .4rem; border: 1px solid var(--line); border-radius: 4px;
          background: var(--bg); color: inherit; width: 12rem; }
  [hidden] { display: none !important; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .spk { padding: .7rem 0; border-bottom: 1px solid var(--line); }
  .spk-head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .spk-head .lab { min-width: 5.5rem; }
  .spk-head input { flex: 1 1 8rem; min-width: 8rem; width: auto; }
  .sample { margin: .75rem 0 0 2.1rem; font-size: .9em; }
  .sample-row { display: flex; flex-wrap: wrap; gap: .1rem .5rem; align-items: baseline; padding-left: .5rem;
                border-left: 2px solid var(--line); }
  .sample.kept .sample-row { border-left-color: var(--ok); }
  .sample.excluded .text { text-decoration: line-through; color: var(--muted); }
  .sample .text { cursor: pointer; flex: 1 1 12rem; }
  .sample time { font-variant-numeric: tabular-nums; font-size: .9em; }
  .ctx { font-size: .8em; color: var(--muted); padding-left: .6rem; white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; font-size: .8em; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .seg label { padding: .05rem .45rem; cursor: pointer; white-space: nowrap; }
  .seg label + input + label { border-left: 1px solid var(--line); }
  .seg input:checked + label { background: var(--line); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg input:disabled + label { cursor: default; opacity: .5; }
  .status { margin: .45rem 0 0 2.1rem; font-size: .8em; color: var(--muted); }
  .save { padding: .8rem 0; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
  @media (min-width: 1100px) {
    body:has(.rec.panel) { max-width: 78rem; }
    .rec.panel { display: grid; grid-template-columns: 27rem 1fr; gap: 2.5rem; align-items: start; }
    .rec.panel > aside { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding-bottom: 5rem;
                         box-sizing: border-box; }
  }
  .line { display: flex; gap: .6rem; padding: .25rem .3rem; border-radius: 4px; }
  .line.playing { background: var(--hl); }
  .line time { font-variant-numeric: tabular-nums; }
  .who { flex: 0 0 7rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { font-weight: normal; font-size: .8em; }
  .suggested { font-style: italic; font-weight: normal; }
  .mixed { font-size: .75em; color: #b45309; border: 1px solid currentColor; border-radius: 3px; padding: 0 .25em; cursor: help; }
  audio { position: fixed; bottom: 0; left: 0; width: 100%; }
</style>
<body>
<main id="app"></main>
<audio id="player" controls hidden></audio>
<script>
const app = document.getElementById("app");
const player = document.getElementById("player");
let lines = [];
let stopAt = null;
let queue = [];
let playingEl = null;
// Set by a click that starts a line, so the transcript scrolls to it even if the user had
// scrolled away; continuous playback only follows while the playing line is in view.
let follow = false;
let flash = "";

function h(tag, props = {}, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...nodes(kids));
  return el;
}
const nodes = kids => kids.flat(Infinity).filter(k => k != null);

const hms = ms => new Date(ms).toISOString().slice(11, 19);
const short = label => label.split("/")[1];

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.status === 204 ? null : res.json();
}

function play(seg, ...next) {
  player.currentTime = seg.start_ms / 1000;
  stopAt = seg.end_ms / 1000;
  queue = next;
  follow = true;
  player.play();
}

const inView = el => {
  const r = el.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight - (player.hidden ? 0 : player.offsetHeight);
};

player.addEventListener("timeupdate", () => {
  const t = player.currentTime;
  if (stopAt != null && t >= stopAt) queue.length ? play(...queue) : player.pause();
  let now = null;
  for (const { seg, el } of lines) {
    const on = !player.paused && seg.start_ms / 1000 <= t && t < seg.end_ms / 1000;
    el.classList.toggle("playing", on);
    if (on && !now) now = el;
  }
  if (now && now !== playingEl && (follow || (playingEl && inView(playingEl)))) {
    now.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  if (now) follow = false;
  playingEl = now ?? playingEl;
});
// Resuming from the native controls plays on past the snippet.
player.addEventListener("pause", () => { stopAt = null; queue = []; });

function progress(r) {
  const p = r.progress;
  if (!p) return r.status === "failed" ? "failed" : null;
  if (p.step === "unstarted") return "not started";
  if (p.step === "transcribing") return [h("progress", { value: p.percent, max: 100 }), ` transcribing ${p.percent}%`];
  if (p.since_ms == null) return "waiting to diarize";
  const s = Math.round((Date.now() - p.since_ms) / 1000);
  return `diarizing for ${s >= 60 ? `${Math.floor(s / 60)}m ` : ""}${s % 60}s`;
}

const day = date => date
  ? new Date(date.slice(0, 10)).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" })
  : "Unknown date";

async function list() {
  player.hidden = true;
  const recs = await api("/recordings");
  const days = Map.groupBy(recs, r => day(r.date));
  app.replaceChildren(...nodes([
    h("h1", {}, "mictap"),
    [...days].map(([d, rs]) => [
      h("h2", {}, d),
      h("table", {}, rs.map(r => h("tr", {},
        h("td", {}, h("a", { href: "#" + r.id }, r.date?.slice(11) ?? r.id)),
        h("td", { className: "muted" }, r.source),
        h("td", {}, progress(r)),
        h("td", { className: "muted" }, r.audio === "expired" ? "audio expired" : ""),
      ))),
    ]),
    h("p", {}, h("a", { href: "/upload" }, "Upload a recording")),
  ]));
  return recs.some(r => r.progress);
}

async function show(id) {
  const r = await api("/recordings/" + encodeURIComponent(id));
  const audio = r.audio === "ready";
  if (player.dataset.id !== id) {
    player.pause();
    player.src = audio ? `/r/${encodeURIComponent(id)}/audio.ogg` : "";
    player.dataset.id = id;
  }
  player.hidden = !audio;

  const labels = [...new Set(r.lines.map(s => s.speaker).filter(Boolean))]
    .sort((a, b) => (a.startsWith("remote") - b.startsWith("remote")) || short(a).slice(1) - short(b).slice(1));
  const sp = label => r.speakers[label] ?? {};
  const name = label => !label ? "?" : sp(label).name ?? (sp(label).suggested ? `${sp(label).suggested}?` : short(label));
  // Three of a speaker's lines from across the meeting (preferring ones of 2 s or more), so
  // a cluster of two people or a room is audible.
  const samples = label => {
    const own = r.lines.filter(s => s.speaker === label);
    const long = own.filter(s => s.end_ms - s.start_ms >= 2000);
    const pool = long.length >= 3 ? long : own;
    return [...new Set([0, 0.5, 1].map(f => pool[Math.round(f * (pool.length - 1))]))];
  };

  const inputs = {};
  const who = l => inputs[l]?.value.trim() || sp(l).suggested || "them";
  // Per label, its samples: whether each was heard and, once heard, kept as only this speaker.
  const picks = Object.fromEntries(labels.map(l => [l, samples(l).map(seg => ({ seg, heard: false, keep: true }))]));
  const heard = l => picks[l].filter(p => p.heard)
    .map(p => ({ start_ms: p.seg.start_ms, end_ms: p.seg.end_ms, correct: p.keep }));
  const naming = (l, name) => heard(l).length ? { name, heard: heard(l) } : { name };
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  // What saving would do for `l`, as the server decides it (see names::confirm).
  const status = l => {
    if (!r.editable) return "";
    const v = inputs[l].value.trim();
    const { name: confirmed, suggested, mixed } = sp(l);
    if (!v && confirmed) return "Saving leaves them unnamed";
    if (!v && !suggested) return "Name them to learn their voice";
    const hs = heard(l);
    if (hs.length) {
      const kept = hs.filter(x => x.correct).length;
      return kept ? `Will learn ${plural(kept, "voice sample")} from what you heard`
        : "No voice will be learned: every line you played was excluded";
    }
    if (confirmed && v === confirmed) return "Voice learned earlier; listen to add clean samples";
    return mixed ? "Mixed cluster: listen and keep clean lines to teach a voice"
      : "Will learn from the cluster's core (nothing heard yet)";
  };
  const refreshers = {};
  const hear = (l, ps) => {
    ps.forEach(p => { p.heard = true; });
    refreshers[l]();
    play(...ps.map(p => p.seg));
  };

  const msg = h("span", { className: "muted" }, flash);
  flash = "";
  const save = async names => {
    if (!Object.keys(names).length) return;
    msg.textContent = "saving…";
    try {
      const learned = await api(`/recordings/${encodeURIComponent(id)}/speakers`, {
        method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(names),
      });
      flash = Object.entries(names).map(([l, { name }]) => name
        ? `${name} confirmed · ${plural(learned[l]?.voices ?? 0, "voice sample")} learned`
        : `${short(l)} left unnamed`).join("; ");
      await show(id);
    } catch (err) { msg.textContent = err.message; }
  };

  const block = l => {
    const { name: confirmed, suggested, mixed } = sp(l);
    const line = h("div", { className: "status" });
    const rows = picks[l].map((p, i) => {
      const at = r.lines.indexOf(p.seg);
      const around = x => x ? h("div", { className: "ctx" }, `${name(x.speaker)}: ${x.text}`) : null;
      const radio = keep => h("input", { type: "radio", name: `${l}-${i}`, id: `${l}-${i}-${keep}`, checked: keep,
        disabled: !r.editable, onchange: () => { p.keep = keep; refresh(); } });
      const only = h("label", { htmlFor: `${l}-${i}-true`, title: "Only this speaker is heard: this line teaches their voice" });
      const verdict = h("span", { className: "seg", role: "radiogroup", ariaLabel: `Line ${i + 1}`, hidden: true },
        radio(true), only,
        radio(false), h("label", { htmlFor: `${l}-${i}-false`, title: "Someone else is heard too: this line is ignored" }, "Someone else too"));
      const unheard = h("span", { className: "muted", style: "font-size: .8em" }, "not heard yet");
      const el = h("div", { className: "sample" },
        around(r.lines[at - 1]),
        h("div", { className: "sample-row" },
          h("button", { type: "button", disabled: !audio, title: `Play line ${i + 1} (key ${i + 1})`, onclick: () => hear(l, [p]) },
            "▶ ", h("time", {}, hms(p.seg.start_ms))),
          h("span", { className: "text", onclick: () => audio && hear(l, [p]) }, `"${p.seg.text}"`),
          unheard, verdict),
        around(r.lines[at + 1]));
      return { p, el, only, verdict, unheard };
    });
    const refresh = () => {
      for (const { p, el, only, verdict, unheard } of rows) {
        only.textContent = `Only ${who(l)}`;
        verdict.hidden = !p.heard;
        unheard.hidden = p.heard;
        el.classList.toggle("kept", p.heard && p.keep);
        el.classList.toggle("excluded", p.heard && !p.keep);
      }
      line.textContent = status(l);
    };
    refreshers[l] = refresh;
    inputs[l] = h("input", { value: confirmed ?? "", placeholder: suggested ? `${suggested}?` : "name",
      ariaLabel: `Name of ${short(l)} (${l.split("/")[0]})`, disabled: !r.editable, oninput: refresh });
    const el = h("div", { className: "spk" },
      h("div", { className: "spk-head" },
        h("button", { type: "button", disabled: !audio, title: "Play their sample lines", onclick: () => hear(l, picks[l]) }, "▶"),
        h("span", { className: "lab" }, short(l), " ", h("span", { className: "track muted" }, l.split("/")[0]),
          mixed ? [" ", h("span", { className: "mixed", title: "These lines sound like more than one voice (two people, or a room). A name is kept, but no voice is learned from it unless you keep clean lines you heard." }, "mixed?")] : null),
        inputs[l],
        suggested && r.editable ? [
          h("button", { type: "button", title: `Confirm ${suggested}`, onclick: () => save({ [l]: naming(l, suggested) }) }, "✓"),
          h("button", { type: "button", title: "Not them", onclick: () => save({ [l]: { name: "" } }) }, "✗"),
        ] : null),
      rows.map(x => x.el),
      line);
    // 1/2/3 play this speaker's samples, except while typing a name.
    el.addEventListener("keydown", e => {
      if (!/^[1-3]$/.test(e.key) || e.target.type === "text" || e.metaKey || e.ctrlKey || e.altKey) return;
      const p = picks[l][+e.key - 1];
      if (p && audio) { e.preventDefault(); hear(l, [p]); }
    });
    refresh();
    return el;
  };

  const form = h("form", {},
    labels.map(block),
    h("div", { className: "save" }, h("button", { disabled: !r.editable }, "Save names"), msg),
  );
  form.onsubmit = e => {
    e.preventDefault();
    const names = {};
    for (const l of labels) {
      const v = inputs[l].value.trim();
      if (v !== (sp(l).name ?? "") || (v && heard(l).length)) names[l] = naming(l, v);
    }
    save(names);
  };

  lines = r.lines.map(seg => ({ seg, el: h("div", { className: "line" },
    h("button", { disabled: !audio, onclick: () => play(seg) }, h("time", {}, hms(seg.start_ms))),
    h("span", { className: "who" + (seg.speaker && !sp(seg.speaker).name && sp(seg.speaker).suggested ? " suggested" : ""), title: seg.speaker ?? "" }, name(seg.speaker),
      " ", h("span", { className: "track muted" }, seg.track)),
    h("span", {}, seg.text),
  ) }));

  playingEl = null;
  app.replaceChildren(...nodes([
    h("h1", {}, h("a", { href: "#" }, "mictap"), " / ", r.date ?? id),
    h("p", { className: "muted" }, progress(r)),
    h("div", { className: "rec" + (labels.length ? " panel" : "") },
      labels.length ? h("aside", {}, form) : null,
      h("section", {},
        !audio ? h("p", { className: "muted" }, r.audio === "expired" ? "Audio deleted after 30 days." : "No audio yet.") : null,
        lines.map(l => l.el))),
  ]));
  return r.progress != null;
}

let refresh;
async function route() {
  clearTimeout(refresh);
  const id = decodeURIComponent(location.hash.slice(1));
  try {
    if (await (id ? show(id) : list())) refresh = setTimeout(route, 5000);
  } catch (err) { app.replaceChildren(h("p", {}, err.message)); }
}
addEventListener("hashchange", route);
route();
</script>
